<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>ItzThienBao</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg"></div>
  <canvas id="fx"></canvas>

  <main class="stage">
    <section class="card" id="card">
      <div class="avatar-wrap">
        <span class="ring glow"></span>
        <span class="ring"></span>
        <img id="avatar" class="avatar" alt="Avatar">
      </div>

      <h1 id="name" class="name"></h1>
      <p class="bio"><span id="typed"></span><i class="caret"></i></p>

      <div class="stats">
        <button id="likeBtn" class="stat like" type="button" aria-label="Thích">
          <span data-icon="heart"></span><b id="likes">0</b>
        </button>
        <span class="stat"><span data-icon="eye"></span><b id="views">0</b></span>
      </div>

      <nav class="links" id="links"></nav>
    </section>
  </main>

  <aside class="player" id="player">
    <button class="p-head" id="pToggle" type="button" aria-expanded="true">
      <span class="p-label"><span data-icon="music"></span>MUSIC</span>
      <span class="p-mini" id="pMini">—</span>
      <span class="p-chev" data-icon="chevron"></span>
    </button>
    <div class="p-body">
      <div class="p-inner">
        <div class="p-info">
          <div class="eq" id="eq"><i></i><i></i><i></i><i></i></div>
          <div class="p-text">
            <div class="p-title" id="pTitle">—</div>
            <div class="p-artist" id="pArtist">—</div>
          </div>
        </div>
        <div class="p-seek">
          <span id="pCur">0:00</span>
          <input id="pSeek" class="range" type="range" min="0" max="1000" value="0" aria-label="Tua nhạc">
          <span id="pDur">0:00</span>
        </div>
        <div class="p-ctrl">
          <button id="pPrev" class="ib" type="button" aria-label="Bài trước" data-icon="prev"></button>
          <button id="pPlay" class="play" type="button" aria-label="Phát / Tạm dừng" data-icon="play"></button>
          <button id="pNext" class="ib" type="button" aria-label="Bài sau" data-icon="next"></button>
          <button id="pShuffle" class="ib" type="button" aria-label="Ngẫu nhiên" data-icon="shuffle"></button>
          <button id="pRepeat" class="ib" type="button" aria-label="Lặp lại một bài" data-icon="repeat"></button>
          <span class="p-vol">
            <span data-icon="volume"></span>
            <input id="pVol" class="range" type="range" min="0" max="100" value="60" aria-label="Âm lượng">
          </span>
        </div>
      </div>
    </div>
  </aside>

  <div class="toast" id="toast" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
